<div>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <h2 class="text-2xl font-bold mb-4">Inscription</h2>
        <div class="flex flex-col gap-4">
            <app-text-input name="firstname" label="Prénom" type="text" placeholder="Entrez votre prénom"
                [control]="signupForm.controls.firstname"></app-text-input>
            <app-text-input name="lastname" label="Nom de famille" type="text" placeholder="Entrez votre nom"
                [control]="signupForm.controls.lastname"></app-text-input>
            <app-text-input name="username" label="Nom d'utilisateur" type="text" placeholder="un nom d'utilisateur"
                [control]="signupForm.controls.username"></app-text-input>
            <app-text-input name="email" label="Adresse mail" type="email"
                placeholder="une adresse mail(nom@example.com)" [control]="signupForm.controls.email"></app-text-input>
            <app-text-input name="trialPassword" label="Mot de passe" type="password" placeholder="un mot de passe"
                [control]="signupForm.controls.trialPassword"></app-text-input>
            <app-text-input name="confirmPassword" label="Confirmer le mot de passe" type="password"
                placeholder="Confirmez votre mot de passe"
                [control]="signupForm.controls.confirmPassword"></app-text-input>
            <small class="error-message">
                @if (signupForm.hasError('passwordMismatch') &&
                signupForm.controls.confirmPassword.touched) {
                Les mots de passe ne correspondent pas.
                }
            </small>
            <app-text-input name="phoneNumber" label="Numéro de téléphone" type="text"
                placeholder="un numéro de téléphone" [control]="signupForm.controls.phoneNumber"></app-text-input>
            <app-date-input name="birthdate" label="Date de naissance" type="date" placeholder="votre date de naissance"
                [control]="signupForm.controls.birthdate"></app-date-input>
        </div>
        <div class="flex items-center justify-around">
            <button type="submit" class="btn btn-primary my-4" [disabled]="signupForm.invalid">Créer mon compte</button>
            <button type="button" class="btn btn-secondary my-4" (click)="goToLogin()">Se connecter</button>
            <button type="reset" class="btn btn-danger my-4">Réinitialiser</button>
        </div>
    </form>
</div>
