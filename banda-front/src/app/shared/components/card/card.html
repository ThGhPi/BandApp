<div class="rounded-2xl overflow-hidden shadow-md bg-surface">

  <!-- Header -->
  <div
    class="px-4 py-3 flex justify-between items-center text-white font-semibold"
    [ngClass]="'bg-' + headerBg">

    <span>{{ title }}</span>
    @if (subtitle) {
        <span>{{ subtitle }}</span>
    }

  </div>

  <!-- sub-Header -->


  <!-- Body -->
  <div class="bg-white">
    <ng-content></ng-content>
  </div>

  <!-- Footer (optional) -->
  <ng-content select="[card-footer]" class="bg-yellow flex justify-between"></ng-content>

</div>
