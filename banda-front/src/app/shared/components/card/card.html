<div class="rounded-2xl overflow-hidden shadow-md
  text-center bg-surface m-3">

  <!-- Header -->
  <div [class]="headerClasses()">

    <div>{{ title() }}</div>
    @if (subtitle()) {
        <div>{{ subtitle() }}</div>
    }

  </div>

  <!-- sub-Header -->


  <!-- Body -->
  <div class="bg-white">
    <ng-content></ng-content>
  </div>

  <!-- Footer (optional) -->
  <ng-content select="[card-footer]"></ng-content>

</div>
