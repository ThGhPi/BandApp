services:
  # ------- SWAGGER - if integrated one doesn't work --------
  # swagger-ui:
  #   image: swaggerapi/swagger-ui
  #   container_name: swagger_ui
  #   restart: always
  #   ports:
  #     - "8099:8080"
  #   environment:
  #     SWAGGER_JSON_URL: http://band-api:8080/v3/api-docs

  # ------- SPRING API -------- 
  band-api:
    build: ./band-api
    container_name: band-api
    restart: always
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres_db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECURITY_JWT_SECRET_KEY: ${JJWT_SECRET_KEY}
      SECURITY_JWT_EXPIRATION_TIME: ${JJWT_EXPIRATION}
      SPRING_PROFILE_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  # ------- DATABASE - change to 17 for prod preferably --------
  postgres:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d
  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "8082:8080"

volumes:
  pgdata: