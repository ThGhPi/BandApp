# api name
spring.application.name=band-api

# server port where the api is exposed
server.port=8081

# Database properties including access for PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres_db:5433/bandatabase}
spring.datasource.username=${DB_USERNAME:vladimircosma}
spring.datasource.password=${DB_PASSORD:rabbijacob}
spring.datasource.driver-class-name=org.postgresql.Driver

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuration de la journalisation (logging)
logging.level.root=error
logging.level.com.thghpi.bandapp=DEBUG
logging.level.org.springframework.data=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.boot.web.embedded.tomcat=INFO