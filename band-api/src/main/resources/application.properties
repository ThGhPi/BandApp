# api name
spring.application.name=band-api

# server port where the api is exposed
server.port=8081

# Spring profile to use
spring.profiles.active=${SPRING_PROFILE_ACTIVE:dev}

# jwt properties
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}

# Password strength requirements
app.password.min-length=${APP_PASSWORD_MIN_LENGTH:8}
app.password.max-length=${APP_PASSWORD_MAX_LENGTH:128}
app.password.regex=${APP_PASSWORD_REGEX:^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).*$}
app.password.require-uppercase=${APP_PASSWORD_REQUIRE_UPPERCASE:true}
app.password.require-lowercase=${APP_PASSWORD_REQUIRE_LOWERCASE:true}
app.password.require-digit=${APP_PASSWORD_REQUIRE_DIGIT:true}
app.password.require-special-character=${APP_PASSWORD_REQUIRE_SPECIAL_CHARACTER:true}

# Password encoder strength
app.password-encoder.strength=${APP_PASSWORD_ENCODER_STRENGTH:10}