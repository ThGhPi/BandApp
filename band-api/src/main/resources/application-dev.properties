

# Database properties including access for PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuration de la journalisation (logging)
logging.level.root=error
logging.level.com.thghpi.bandapp=DEBUG
logging.level.org.springframework.data=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# Swagger configuration - to enable it in development
# Check http://localhost:8081/v3/api-docs for the OpenAPI JSON documentation
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
# Check http://localhost:8081/swagger-ui.html for the Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# jwt properties
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}

# Password strength requirements
app.password.min-length=${PASSWORD_MIN_LENGTH:8}
app.password.max-length=${PASSWORD_MAX_LENGTH:128}
app.password.regex=${PASSWORD_REGEX:^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).*$}
app.password.require-uppercase=${PASSWORD_REQUIRE_UPPERCASE:true}
app.password.require-lowercase=${PASSWORD_REQUIRE_LOWERCASE:true}
app.password.require-digit=${PASSWORD_REQUIRE_DIGIT:true}
app.password.require-special-character=${PASSWORD_REQUIRE_SPECIAL_CHARACTER:true}

# Password encoder strength
app.password-encoder.strength=${PASSWORD_ENCODER_STRENGTH:10}