# Database properties including access for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/testdatabase
spring.datasource.username=testuser
spring.datasource.password=testpassword

## Hibernate properties
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# jwt properties
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}

# Password strength requirements
app.password.min-length=${PASSWORD_MIN_LENGTH:8}
app.password.max-length=${PASSWORD_MAX_LENGTH:128}
app.password.regex=${PASSWORD_REGEX:^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).*$}
app.password.require-uppercase=${PASSWORD_REQUIRE_UPPERCASE:true}
app.password.require-lowercase=${PASSWORD_REQUIRE_LOWERCASE:true}
app.password.require-digit=${PASSWORD_REQUIRE_DIGIT:true}
app.password.require-special-character=${PASSWORD_REQUIRE_SPECIAL_CHARACTER:true}

# Password encoder strength
app.password-encoder.strength=${PASSWORD_ENCODER_STRENGTH:10}

# Swagger configuration - disabled during tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false